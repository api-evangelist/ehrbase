api_mcp_server:
  exists: false
  detail: >-
    No MCP server is published for the EHRbase openEHR REST API by the project or by
    vitagroup. A candidate tool set could be derived from the 63 published operations,
    but deriving one here would misrepresent a self-hosted server as an agent-callable
    endpoint - each deployer would have to run it themselves against their own
    instance. Recorded as absent rather than invented.
