generated: '2026-09-02'
method: probed
source: >-
  https://www.ehrbase.org/.well-known/oauth-protected-resource,
  https://www.ehrbase.org/.well-known/oauth-authorization-server,
  live POST tools/list against https://www.ehrbase.org/wp-json/mcp/mcp-oauth-server on 2026-09-02
status: live
note: >-
  READ THIS BEFORE USING IT. ehrbase.org DOES serve a real, reachable, OAuth-protected
  remote MCP endpoint - but it belongs to the WordPress marketing site, not to the
  EHRbase clinical data repository. It was discovered through the RFC 9728
  protected-resource metadata document at
  https://www.ehrbase.org/.well-known/oauth-protected-resource, which names
  https://www.ehrbase.org/wp-json/mcp/mcp-oauth-server as the resource with
  scopes_supported ["mcp"]. The wp-json namespace listing confirms a WordPress
  Abilities API + MCP adapter is installed (namespaces include "mcp" and
  "wp-abilities/v1"). There is NO MCP server for the openEHR REST API itself, and
  EHRbase - being software each customer self-hosts - has no hosted API to put behind
  one. Do not present this endpoint as a way for an agent to read or write clinical
  data; it is a website-content surface.
deployment:
  mode: remote
  endpoint: https://www.ehrbase.org/wp-json/mcp/mcp-oauth-server
  auth: oauth
  verified: probed
  scope: website-content
  covers_api: false
probe:
  request: 'POST {"jsonrpc":"2.0","id":1,"method":"tools/list"} with Accept: application/json, text/event-stream'
  http_status: 401
  response_body: '{"code":"mcp_unauthorized","message":"MCP authentication required.","data":{"status":401}}'
  www_authenticate: >-
    Bearer realm="https://www.ehrbase.org",
    resource_metadata="https://www.ehrbase.org/.well-known/oauth-protected-resource"
  allow: POST, GET, DELETE
  conclusion: >-
    The live tool schema is auth-gated. tools/list requires a bearer token, so no
    inputSchema could be captured. The RFC 9728 challenge flow is implemented
    correctly, which is itself evidence this is a deliberately published MCP surface
    rather than an accident.
oauth:
