  metadata: https://www.ehrbase.org/.well-known/oauth-authorization-server
  authorization_endpoint: https://www.ehrbase.org/oauth/authorize
  token_endpoint: https://www.ehrbase.org/oauth/token
  revocation_endpoint: https://www.ehrbase.org/oauth/revoke
  grant_types_supported: [authorization_code, refresh_token]
  code_challenge_methods_supported: [S256]
  scopes_supported: [mcp]
  token_endpoint_auth_methods_supported: [none]
  client_id_metadata_document_supported: true
tools:
