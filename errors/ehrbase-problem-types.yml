note: >-
  EHRbase does NOT publish an RFC 9457 problem+json envelope, and its OpenAPI declares
  error responses as bare status codes with no schema, no description and no example -
  57 of the 63 operations declare only a 2xx. That is the finding: an agent calling
  this API cannot learn the failure shape from the contract. The catalog below is
  derived from the status codes that ARE declared, with the openEHR ITS-REST semantics
  that give each one its meaning. Titles and remediation are the standard's, not
  invented EHRbase text.
envelope:
