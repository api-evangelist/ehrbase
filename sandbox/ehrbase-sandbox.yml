generated: '2026-09-02'
method: probed
source: >-
  https://sandkiste.ehrbase.org/, https://docs.ehrbase.org/docs/EHRbase/Installation,
  live probes of https://sandkiste.ehrbase.org/ehrbase/** on 2026-09-02
name: EHRbase Sandbox ("Sandkiste")
url: https://sandkiste.ehrbase.org/
note: >-
  EHRbase runs a genuinely open, credential-free public instance. The Installation docs
  lead with it: "The fastest way to get started with EHRbase and openEHR is the EHRbase
  Sandbox available at https://sandkiste.ehrbase.org/." It is a real EHRbase server
  running with AUTH_TYPE=NONE, not a mock - the OpenAPI captured in this repo was
  generated by that instance, and reads returned live clinical templates anonymously.
  There are no test keys or test cards to publish because there are no keys at all.
environments:
  - id: sandbox
    label: Sandkiste public sandbox
    console_url: https://sandkiste.ehrbase.org/
    api_base_url: https://sandkiste.ehrbase.org/ehrbase
    openapi_url: https://sandkiste.ehrbase.org/ehrbase/v3/api-docs
    swagger_ui: https://sandkiste.ehrbase.org/ehrbase/swagger-ui/index.html
    auth: none
    signup_required: false
    data: shared, public, resettable - do not put real patient data in it
    server_version_observed: 2.33.0
    observed: '2026-09-02'
  - id: self-hosted
    label: Local Docker deployment
    detail: >-
      docker run ... ehrbase/ehrbase against ehrbase/ehrbase-v2-postgres:16.2, reachable
      at http://localhost:8080/ehrbase. Starts with no authentication configured.
    docs: https://docs.ehrbase.org/docs/EHRbase/Installation
    auth: none by default
probes:
  - url: https://sandkiste.ehrbase.org/ehrbase/v3/api-docs
    method: GET
    status: 200
    content_type: application/json
    result: OpenAPI 3.1.0, 44 paths, 63 operations, 77 schemas
  - url: https://sandkiste.ehrbase.org/ehrbase/rest/status
    method: GET
    status: 200
    result: >-
      {"ehrbase_version":"2.33.0","openehr_sdk_version":"2.33.1",
      "archie_version":"3.13.0","jvm_version":"Eclipse Adoptium 25.0.3+9-LTS",
      "postgres_version":"PostgreSQL 16.15"}
  - url: https://sandkiste.ehrbase.org/ehrbase/rest/openehr/v1/definition/template/adl1.4
    method: GET
    status: 200
    result: >-
      Live operational template list, anonymously readable - includes
      "International Patient Summary v7.1"
      (openEHR-EHR-COMPOSITION.health_summary.v1) and
      "Self reported blood pressure" (openEHR-EHR-COMPOSITION.self_reported_data.v1).
test_data:
  fixtures_published: true
  detail: >-
    The sandbox is preloaded with real operational templates any caller can list and
    fetch. Additional openEHR test data ships as a Maven artifact,
    org.ehrbase.openehr.sdk:test-data (2.35.0, 2026-08-17), and as the
    ehrbase/integration-tests Robot Framework suite.
  sources:
    - https://central.sonatype.com/artifact/org.ehrbase.openehr.sdk/test-data
    - https://github.com/ehrbase/integration-tests
test_credentials:
  published: false
  detail: >-
    None exist. The sandbox is unauthenticated and self-hosted instances default to
    AUTH_TYPE=NONE. When Basic auth IS enabled the docs publish the shipped DEFAULT
    account names (ehrbase-user / ehrbase-admin) as configuration defaults to be
    overridden - they are documented defaults, not test credentials for a hosted
    service.
  docs: https://docs.ehrbase.org/docs/EHRbase/Explore/Security
time_simulation:
  supported: false
  detail: >-
    No test clock. The API does, however, support time-scoped reads across every
    versioned object (version_at_time on EHR_STATUS, COMPOSITION and DIRECTORY), which
    is the openEHR equivalent for reasoning about historical state.
