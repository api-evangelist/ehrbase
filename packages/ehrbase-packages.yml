note: >-
  EHRbase is a self-hosted, Apache-2.0 openEHR clinical data repository. Its
  distribution surface is Maven Central (server modules + the openEHR_SDK Java
  client) and Docker Hub (the runnable server image), not a language-SDK matrix -
  there are no first-party JavaScript, Python, Go, Ruby, PHP or .NET clients. All
  versions and dates below were read from the registry metadata endpoints on
  2026-09-02. Currency is healthy: the newest Maven Central release (2.35.1,
  2026-08-20) matches the newest GitHub release tag, and the Docker image tracks it.
  The two dated laggards - ehrbase-v2-postgres 16.2 (2024-04-08) and migration-tool
  1.2.0 (2024-06-10) - are pinned companion images, not abandoned clients.
