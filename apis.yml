aid: ehrbase
name: EHRbase
description: >-
  EHRbase is an open source openEHR Clinical Data Repository (CDR) - a standards-based
  backend for storing, versioning and querying structured clinical data. It implements
  the official openEHR REST API (ITS-REST 1.0.2) against openEHR Reference Model 1.1.0,
  is queried with the Archetype Query Language (AQL), and adds Simplified Data Template
  projections (flat and structured JSON web templates) that make deeply nested openEHR
  compositions practical to write against. It is Apache-2.0 software each organization
  self-hosts - no vendor API host, no signup, no metering - maintained by vitagroup AG
  with the openEHR community, with a commercial distribution (HIP EHRbase) adding
  multi-tenancy, IHE ATNA audit logging, AQL event triggers, Saga-pattern transaction
  compensation and SLAs. A public credential-free sandbox at sandkiste.ehrbase.org
  serves its live OpenAPI 3.1.0 contract of 63 operations.
