apis:
- aid: ehrbase:openehr-rest-api
  name: EHRbase openEHR REST API
  description: >-
    The standard openEHR ITS-REST 1.0.2 surface - 31 paths and 45 operations covering
    EHR, EHR_STATUS, COMPOSITION, VERSIONED_COMPOSITION, CONTRIBUTION, DIRECTORY,
    operational templates (ADL 1.4 and ADL 2), stored queries and ad-hoc AQL execution.
    Writes are versioned rather than mutated, guarded by If-Match on the preceding
    version_uid, and audited through the openEHR-AUDIT_DETAILS header. EHRbase adds two
    non-standard but essential projections: the web template (a flattened node tree with
    aqlPath per leaf) and the flat/structured JSON composition media types.
  humanURL: https://docs.ehrbase.org/api/hip-ehrbase/openehr
  baseURL: https://sandkiste.ehrbase.org/ehrbase
  image: https://raw.githubusercontent.com/ehrbase/ehrbase/develop/ehrbase.png
  tags:
  - openEHR
  - Electronic Health Records
  - Clinical Data
  - AQL
  - Healthcare
  properties:
  - type: OpenAPI
    url: openapi/ehrbase-openehr-rest-api-openapi.json
  - type: Overlay
    url: overlays/ehrbase-openehr-rest-overlay.yaml
  - type: Documentation
    url: https://docs.ehrbase.org/docs/EHRbase/Explore/openEHR-REST
  - type: APIReference
    url: https://docs.ehrbase.org/api/hip-ehrbase/openehr
- aid: ehrbase:admin-api
  name: EHRbase Admin API
  description: >-
    The opt-in administrative surface - 8 paths and 11 operations for physical deletion
    of EHRs, compositions, directories and stored queries, and for replacing or removing
    operational templates. Disabled by default and gated on the admin role; every
    operation declares 401 and 403, and template operations return 422 when compositions
    still reference the template. These changes are irreversible.
  humanURL: https://docs.ehrbase.org/docs/EHRbase/Explore/Admin-REST
  baseURL: https://sandkiste.ehrbase.org/ehrbase
  image: https://raw.githubusercontent.com/ehrbase/ehrbase/develop/ehrbase.png
  tags:
  - Administration
  - openEHR
  - Healthcare
  properties:
  - type: OpenAPI
    url: openapi/ehrbase-admin-api-openapi.json
  - type: Overlay
    url: overlays/ehrbase-admin-overlay.yaml
  - type: Documentation
    url: https://docs.ehrbase.org/docs/EHRbase/Explore/Admin-REST
- aid: ehrbase:status-api
  name: EHRbase Status and Metrics API
  description: >-
    A version heartbeat at /rest/status reporting the running EHRbase, openEHR SDK,
    Archie, JVM, OS and PostgreSQL versions, plus the Spring Boot Actuator surface at
    /management providing health, liveness, readiness, metrics and Prometheus scrape
    endpoints. The Actuator surface is disabled by default and its exposure is
    configurable as admin-only, private or public.
  humanURL: https://docs.ehrbase.org/docs/EHRbase/Explore/Status-And-Metrics
  baseURL: https://sandkiste.ehrbase.org/ehrbase
  image: https://raw.githubusercontent.com/ehrbase/ehrbase/develop/ehrbase.png
  tags:
  - Monitoring
  - Observability
  - Operations
  properties:
  - type: OpenAPI
    url: openapi/ehrbase-status-api-openapi.json
  - type: Overlay
    url: overlays/ehrbase-status-overlay.yaml
  - type: Documentation
    url: https://docs.ehrbase.org/docs/EHRbase/Explore/Status-And-Metrics
